# Reusable workflow: build the Mule project on every PR to main.
# MUnit is skipped until a Mule EE licence is available; the coverage gate
# is retained in the parent POM and will activate automatically once MUnit
# is re-enabled by removing -Dmunit.test.skip=true.
#
# Security notes:
#   - Triggered only via workflow_call (never pull_request_target).
#   - Secrets are passed explicitly from the caller; fork PRs receive no secrets
#     from the caller (pull_request trigger isolation) and will fail the Exchange
#     resolve step — expected behaviour for external forks; internal org PRs work.
#   - No write permissions are granted.
name: PR Validate (reusable)

on:
  workflow_call:
    inputs:
      java_version:
        description: 'JDK version for the build'
        type: string
        default: '17'
      maven_args:
        description: 'Extra Maven arguments passed to the build step.'
        type: string
        default: ''
    secrets:
      # Connected App with Exchange Viewer scope — used to resolve parent POM and connectors.
      exchange_client_id:
        required: true
      exchange_client_secret:
        required: true
      # MuleSoft EE Nexus credentials — reserved; wire here when licence is available.
      # mulesoft_ee_username / mulesoft_ee_password

# Least-privilege: read-only for all jobs in this reusable workflow.
permissions:
  contents: read

jobs:
  validate:
    name: Build (MUnit skipped — no EE licence)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java ${{ inputs.java_version }}
        # TODO: pin to SHA — gh release view v4 -R actions/setup-java --json tagName
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Configure Maven — Anypoint Exchange
        uses: devops-foundry-poc/mule-cicd-workflows/.github/actions/configure-maven@main
        with:
          exchange_client_id: ${{ secrets.exchange_client_id }}
          exchange_client_secret: ${{ secrets.exchange_client_secret }}
          github_token: ${{ github.token }}

      - name: Build (MUnit skipped)
        run: |
          mvn verify \
            -Dmunit.test.skip=true \
            ${{ inputs.maven_args }} \
            --no-transfer-progress \
            --batch-mode
        # -Dmunit.test.skip=true bypasses MUnit execution.
        # Remove this flag (and add EE creds to configure-maven) to re-enable
        # the 80 % coverage gate defined in the parent POM's pluginManagement.
