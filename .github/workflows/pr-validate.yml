# Reusable workflow: build the Mule project and enforce the 80 % MUnit coverage gate.
# Called by every app repo on pull_request events targeting main.
#
# Security notes:
#   - Triggered only via workflow_call (never pull_request_target).
#   - Secrets are passed explicitly from the caller; fork PRs receive no secrets
#     from the caller (pull_request trigger isolation) and will fail the Exchange
#     resolve step — expected behaviour for external forks; internal org PRs work.
#   - No write permissions are granted.
name: PR Validate (reusable)

on:
  workflow_call:
    inputs:
      java_version:
        description: 'JDK version for the build'
        type: string
        default: '17'
      maven_args:
        description: 'Extra Maven arguments (e.g. -Dmunit.test=...)'
        type: string
        default: ''
    secrets:
      # Connected App with Exchange Viewer scope — used to resolve parent POM and connectors.
      exchange_client_id:
        required: true
      exchange_client_secret:
        required: true
      # MuleSoft EE Nexus credentials (obtained via Salesforce service request).
      mulesoft_ee_username:
        required: false
      mulesoft_ee_password:
        required: false

# Least-privilege: read-only for all jobs in this reusable workflow.
permissions:
  contents: read

jobs:
  validate:
    name: Build + MUnit (80 % gate)
    runs-on: ubuntu-latest
    # Pin SHA — re-verify before merge:
    #   git ls-remote https://github.com/actions/checkout refs/tags/v4.2.2
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java ${{ inputs.java_version }}
        # TODO: pin to SHA — gh release view v4 -R actions/setup-java --json tagName,body
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Configure Maven — Exchange + MuleSoft EE repositories
        env:
          EXCHANGE_CLIENT_ID: ${{ secrets.exchange_client_id }}
          EXCHANGE_CLIENT_SECRET: ${{ secrets.exchange_client_secret }}
          MULESOFT_EE_USERNAME: ${{ secrets.mulesoft_ee_username }}
          MULESOFT_EE_PASSWORD: ${{ secrets.mulesoft_ee_password }}
        run: |
          mkdir -p "$HOME/.m2"
          python3 - << 'PYEOF'
          import os

          cid  = os.environ.get("EXCHANGE_CLIENT_ID", "")
          csec = os.environ.get("EXCHANGE_CLIENT_SECRET", "")
          ee_u = os.environ.get("MULESOFT_EE_USERNAME", "__FILL_ME_EE_USERNAME__")
          ee_p = os.environ.get("MULESOFT_EE_PASSWORD", "__FILL_ME_EE_PASSWORD__")

          # Exchange password format: <client_id>~?~<client_secret>
          exchange_password = f"{cid}~?~{csec}"

          settings = f"""<?xml version="1.0" encoding="UTF-8"?>
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
            <servers>
              <server>
                <id>anypoint-exchange-v3</id>
                <username>~~~Client~~~</username>
                <password>{exchange_password}</password>
              </server>
              <server>
                <id>mulesoft-ee-releases</id>
                <username>{ee_u}</username>
                <password>{ee_p}</password>
              </server>
            </servers>
          </settings>"""

          import os as _os
          with open(_os.path.expanduser("~/.m2/settings.xml"), "w") as f:
              f.write(settings)
          PYEOF

      - name: Build and run MUnit (80 % coverage gate)
        run: |
          mvn verify ${{ inputs.maven_args }} \
            --no-transfer-progress \
            --batch-mode
        # The 80 % gate is configured in the parent POM's pluginManagement for
        # munit-maven-plugin (requiredApplicationCoverage / requiredResourceCoverage /
        # requiredFlowCoverage = 80). A coverage miss fails the build here.
