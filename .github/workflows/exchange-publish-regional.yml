# Reusable workflow: publish a Mule application to Anypoint Exchange.
# The pom.xml groupId must already be the target BG UUID — the caller is
# responsible for ensuring the app pom has the correct groupId.
# No pom.xml modification is done here.
name: Exchange Publish Regional (reusable)

on:
  workflow_call:
    inputs:
      region_bg_id:
        description: 'Anypoint BG UUID. Used as -DexchangeGroupId for the Maven deploy.'
        type: string
        required: true
      artifact_name:
        description: 'Name for the GitHub Actions artifact.'
        type: string
        default: 'mule-app'
      java_version:
        type: string
        default: '17'
    secrets:
      connected_app_client_id:
        required: true
      connected_app_client_secret:
        required: true
      gh_token:
        required: false
    outputs:
      release_version:
        description: 'Published release version (SNAPSHOT stripped).'
        value: ${{ jobs.publish.outputs.release_version }}

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  publish:
    name: Publish to Exchange
    runs-on: ubuntu-latest
    outputs:
      release_version: ${{ steps.version.outputs.release_version }}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java ${{ inputs.java_version }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}
          cache: maven

      - name: Configure Maven
        uses: devops-foundry-poc/mule-cicd-workflows/.github/actions/configure-maven@main
        with:
          exchange_client_id: ${{ secrets.connected_app_client_id }}
          exchange_client_secret: ${{ secrets.connected_app_client_secret }}
          github_token: ${{ secrets.gh_token }}

      - name: Set release version (MAJOR.MINOR.run_number)
        id: version
        run: |
          BASE=$($MVN help:evaluate -Dexpression=project.version -q -DforceStdout \
            --no-transfer-progress --batch-mode)
          MAJOR_MINOR=$(echo "${BASE%-SNAPSHOT}" | cut -d. -f1,2)
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          $MVN versions:set -DnewVersion="${VERSION}" \
            -DgenerateBackupFiles=false --no-transfer-progress --batch-mode
          echo "release_version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build and publish to Exchange
        run: |
          $MVN deploy -P deploy-to-exchange-v3 \
            -DexchangeGroupId=${{ inputs.region_bg_id }} \
            --no-transfer-progress --batch-mode

      - name: Upload Mule JAR
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: target/*-mule-application.jar
          if-no-files-found: error
          retention-days: 7
