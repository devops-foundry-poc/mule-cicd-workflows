# Composite action: write ~/.m2/settings.xml for Anypoint Exchange + MuleSoft EE.
# Called by every workflow that needs Maven to resolve or publish to Exchange.
#
# Security: inputs carrying secrets are never echoed; GitHub masks any value
# that originated from a secrets.* context, even when passed through inputs.
name: Configure Maven for Anypoint Exchange
description: >
  Writes ~/.m2/settings.xml with credentials for Anypoint Exchange V3 and
  MuleSoft EE Nexus. Credentials are injected via env vars (never echoed).

inputs:
  exchange_client_id:
    description: 'Connected App client ID (Exchange Viewer or Contributor scope).'
    required: true
  exchange_client_secret:
    description: 'Connected App client secret.'
    required: true
  github_token:
    description: >
      GITHUB_TOKEN for resolving the parent POM from GitHub Packages
      (mule-shared-assets). Pass secrets.GITHUB_TOKEN from the calling workflow.
      If omitted the github server entry is written with an empty password —
      resolution will fail for packages that require authentication.
    required: false
    default: ''
  # MuleSoft EE Nexus credentials — reserved for future use when an EE licence is available.
  # Add mulesoft_ee_username / mulesoft_ee_password inputs here and a matching <server> block
  # in the settings below once the credentials are obtained via Salesforce service request.

runs:
  using: composite
  steps:
    - name: Install Maven 3.8.8 and export MVN variable
      shell: bash
      run: |
        # mule-maven-plugin 4.x uses maven-resolver 1.x which is incompatible with
        # Maven 3.9.x (maven-resolver 2.x, breaking DefaultMirrorSelector API change).
        # Export MVN pointing to 3.8.8 so callers use `$MVN` instead of bare `mvn`.
        # Using $GITHUB_ENV (not PATH) to guarantee the variable reaches calling workflows.
        MVN_VERSION="3.8.8"
        MVN_HOME="${HOME}/.local/apache-maven-${MVN_VERSION}"
        if [ ! -d "${MVN_HOME}" ]; then
          echo "Downloading Maven ${MVN_VERSION}..."
          wget -q \
            "https://archive.apache.org/dist/maven/maven-3/${MVN_VERSION}/binaries/apache-maven-${MVN_VERSION}-bin.tar.gz" \
            -O /tmp/maven.tar.gz
          mkdir -p "${HOME}/.local"
          tar -xzf /tmp/maven.tar.gz -C "${HOME}/.local/"
          rm /tmp/maven.tar.gz
        fi
        echo "MVN=${MVN_HOME}/bin/mvn" >> "$GITHUB_ENV"
        echo "Maven ${MVN_VERSION} ready at ${MVN_HOME}/bin/mvn"

    - name: Write Maven settings
      shell: python3 {0}
      env:
        EXCHANGE_CLIENT_ID: ${{ inputs.exchange_client_id }}
        EXCHANGE_CLIENT_SECRET: ${{ inputs.exchange_client_secret }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
      run: |
        import os

        cid        = os.environ["EXCHANGE_CLIENT_ID"]
        csec       = os.environ["EXCHANGE_CLIENT_SECRET"]
        github_tok = os.environ.get("GITHUB_TOKEN", "")

        # Exchange password format: <client_id>~?~<client_secret>
        exchange_password = f"{cid}~?~{csec}"

        settings = f"""<?xml version="1.0" encoding="UTF-8"?>
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
          <servers>
            <server>
              <id>anypoint-exchange-v3</id>
              <username>~~~Client~~~</username>
              <password>{exchange_password}</password>
            </server>
            <server>
              <id>github</id>
              <username>x-access-token</username>
              <password>{github_tok}</password>
            </server>
            <!-- mulesoft-ee-releases: add <server> here when EE licence is available -->
          </servers>
        </settings>"""

        os.makedirs(os.path.expanduser("~/.m2"), exist_ok=True)
        with open(os.path.expanduser("~/.m2/settings.xml"), "w") as f:
            f.write(settings)
